version: 2.1
jobs:
  build-and-test:
    docker:
      - image: cimg/node:22.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package.json" }}
      - run: npm install
      - save_cache:
          key: npm-v1-{{ checksum "package.json" }}
          paths:
            - node_modules
      # There are no unit tests yet: at least make sure every module parses.
      - run:
          name: Check every module parses
          command: |
            npm install --no-save acorn@8.14.0
            for f in index.js src/*.js; do
              npx acorn --ecma2022 --module --silent "$f" || { echo "Syntax error in $f"; exit 1; }
            done
workflows:
  build-and-test:
    jobs:
      - build-and-test
